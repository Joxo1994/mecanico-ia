<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mecánico IA</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      margin: 0;
      background: #111827;
      color: white;
    }
    .app {
      max-width: 600px;
      margin: auto;
      padding: 25px 18px;
    }
    h1 {
      text-align: center;
      margin-bottom: 5px;
    }
    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 25px;
    }
    .card {
      background: #1f2937;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }
    select,
    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 16px;
    }
    textarea {
      min-height: 130px;
    }
    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }
    #resultado {
      display: none;
      line-height: 1.6;
    }
    .causa {
      margin: 8px 0;
    }
  </style>
</head>
<body>
<div class="app">
  <h1>🔧 Mecánico IA</h1>
  <div class="subtitle">
    Diagnóstico inteligente para coches y motos
  </div>
  <div class="card">
    <label>Tipo de vehículo</label>
    <select id="tipo">
      <option value="moto">🏍️ Moto</option>
      <option value="coche">🚗 Coche</option>
    </select>
    <label>Marca y modelo</label>
    <input
      id="vehiculo"
      type="text"
      placeholder="Ej: Triumph Street Triple 675"
    >
    <label>Describe el problema</label>
    <textarea
      id="problema"
      placeholder="Ej: Da tirones a 2.000 rpm en segunda marcha..."
    ></textarea>
    <button onclick="diagnosticar()">
      🔍 Analizar avería
    </button>
  </div>
  <div class="card" id="resultado"></div>
</div>
<script src="app.js"></script>
<script>
function diagnosticar() {
  const vehiculo =
    document.getElementById("vehiculo").value;
  const problema =
    document.getElementById("problema").value;
  const resultado =
    document.getElementById("resultado");
  if (!problema.trim()) {
    resultado.style.display = "block";
    resultado.innerHTML =
      "⚠️ Describe primero los síntomas de la avería.";
    return;
  }
  const diagnostico =
    analizarAveria(vehiculo, problema);
  let html = "";
  html += "<h2>🔧 Diagnóstico</h2>";
  html +=
    "<p><strong>Vehículo:</strong> " +
    diagnostico.vehiculo +
    "</p>";
  html += "<h3>⚠️ Posibles causas</h3>";
  diagnostico.causas.forEach(function(causa) {
    html +=
      "<div class='causa'>🔹 " +
      causa +
      "</div>";
  });
  html += "<h3>🔍 Comprobaciones recomendadas</h3>";
  diagnostico.comprobaciones.forEach(function(comprobacion) {
    html +=
      "<div class='causa'>✅ " +
      comprobacion +
      "</div>";
  });
  html +=
    "<br><small>⚠️ Diagnóstico orientativo. " +
    "Comprueba la avería antes de sustituir piezas.</small>";
  resultado.innerHTML = html;
  resultado.style.display = "block";
}
</script>
</body>
</html>
