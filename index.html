<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mecánico-IA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitulo {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 25px;
    }

    .card {
      background: #1f2937;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: none;
      margin-bottom: 15px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #4b5563;
      cursor: not-allowed;
    }

    .mensaje {
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      background: #374151;
      display: none;
    }

    .respuesta {
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .progreso {
      color: #60a5fa;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .nuevo {
      margin-top: 15px;
      background: #059669;
    }

    .nuevo:hover {
      background: #047857;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🔧 Mecánico-IA</h1>

    <div class="subtitulo">
      Diagnóstico inteligente para coches y motos
    </div>

    <div class="card">

      <label for="vehiculo">Vehículo</label>

      <input
        id="vehiculo"
        type="text"
        placeholder="Ej: Audi A3 1.8 TFSI 2011"
      >

      <label for="tipo">Tipo de vehículo</label>

      <select id="tipo">
        <option value="coche">Coche</option>
        <option value="moto">Moto</option>
      </select>

      <label for="problema">¿Qué problema tiene?</label>

      <textarea
        id="problema"
        placeholder="Describe los síntomas..."
      ></textarea>

      <button id="btnDiagnostico" onclick="iniciarDiagnostico()">
        🔍 Comenzar diagnóstico
      </button>

    </div>

    <div id="zonaDiagnostico" class="card" style="display:none;">

      <div id="progreso" class="progreso"></div>

      <div id="pregunta" class="respuesta"></div>

      <textarea
        id="respuestaUsuario"
        placeholder="Escribe tu respuesta..."
      ></textarea>

      <button onclick="responderPregunta()">
        ➡️ Continuar
      </button>

    </div>

    <div id="resultado" class="card" style="display:none;">

      <h2>🔧 Diagnóstico</h2>

      <div id="textoResultado" class="respuesta"></div>

      <button class="nuevo" onclick="nuevoDiagnostico()">
        🔄 Nuevo diagnóstico
      </button>

    </div>

    <div id="mensaje" class="mensaje"></div>

  </div>

  <script src="app.js"></script>

</body>
</html>
